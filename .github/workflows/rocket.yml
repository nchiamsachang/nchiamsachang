name: Update rocket chart

on:
  schedule:
    - cron: "17 6 * * *"    # daily at 06:17 utc
  workflow_dispatch:         # allows manual runs
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/rocket.yml"

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw rocket.svg
        run: python3 scripts/rocket.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the chart if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rocket.svg
          git diff --cached --quiet || git commit -m "Update rocket chart"
          git push
