name: Update profile charts

on:
  schedule:
    - cron: "17 6 * * *"    # daily at 06:17 utc
  workflow_dispatch:         # allows manual runs
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/rocket.yml"

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw rocket.svg
        run: python3 scripts/rocket.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw langs.svg
        run: python3 scripts/langs.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the charts if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rocket.svg langs.svg
          git diff --cached --quiet || git commit -m "Update profile charts"
          git push
